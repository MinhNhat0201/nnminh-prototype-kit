<!doctype html>
<html lang="{{LANGUAGE}}"{{HTML_ATTRS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="{{VERSION_META}}" content="{{VERSION}}">
<title>{{APP_NAME}}</title>
<style>/* @ds:begin */
{{DS_CSS}}
/* @ds:end */</style>
<!-- SHELL:css -->
<!-- /SHELL:css -->
<style>
/* ==== Page CSS: home ====
   CSS of this page only. Shared CSS lives in _shell/shell.css. Same rules: DS tokens only, never restyle a DS class,
   local components in a block opened by a comment "{{LOCAL_MARKER}}: <name>" with classes prefixed "{{LOCAL_PREFIX}}". */
</style>
</head>
<body>
<div class="app">
  <!-- SHELL:top -->
  <!-- /SHELL:top -->

  <main class="app-main" id="view" tabindex="-1"></main>

  <!-- SHELL:foot -->
  <!-- /SHELL:foot -->
</div>

<template id="page-home">
  <section class="app-page">
    <h1>{{APP_NAME}}</h1>
    <p>Home page of a multi-page prototype. Each feature is one folder with its own index.html; the shell comes from _shell/.</p>
    <div class="app-panel">
      <strong>Recent items</strong>
      <ul class="app-list" data-slot="items"></ul>
    </div>
  </section>
</template>
<template id="page-item">
  <section class="app-page">
    <p><a href="#/">Back to home</a></p>
    <h1 data-slot="title"></h1>
    <div class="app-panel"><span data-slot="body"></span></div>
  </section>
</template>

<!-- MOCK DATA: invented sample content for the prototype. No real records, no real API. -->
<script type="application/json" id="mock-data" data-mock="true">
{
  "items": [
    { "id": "1", "title": "Sample item one", "body": "Mock description for the first sample item." },
    { "id": "2", "title": "Sample item two", "body": "Mock description for the second sample item." }
  ]
}
</script>

<!-- SHELL:js -->
<!-- /SHELL:js -->
<script>
(function () {
  'use strict';
  var MOCK = JSON.parse(document.getElementById('mock-data').textContent);
  function page(id) { return document.getElementById('page-' + id).content.cloneNode(true); }
  APP_SHELL.router([
    { path: '/', title: 'Home', render: function () {
      var f = page('home'), list = f.querySelector('[data-slot="items"]');
      MOCK.items.forEach(function (it) {
        var li = document.createElement('li'), a = document.createElement('a');
        a.href = '#/items/' + encodeURIComponent(it.id);
        a.textContent = it.title;
        li.appendChild(a); list.appendChild(li);
      });
      return f;
    } },
    { path: '/items/:id', title: 'Item', render: function (params) {
      var it = MOCK.items.filter(function (x) { return x.id === params.id; })[0], f = page('item');
      f.querySelector('[data-slot="title"]').textContent = it ? it.title : 'Item not found';
      f.querySelector('[data-slot="body"]').textContent = it ? it.body : 'This sample item does not exist.';
      return f;
    } }
  ], document.getElementById('view'), '{{APP_NAME}}');
})();
</script>
</body>
</html>
